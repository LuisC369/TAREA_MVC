<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-people"></i> Clientes</h1>
        <a href="/clientes/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo cliente</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div th:if="${clientes.empty}" class="alert alert-info">No hay clientes registrados.</div>

    <div th:unless="${clientes.empty}" class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>NIT</th>
                    <th>Nombre completo</th>
                    <th>Email</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each recorre la lista que mando el controlador -->
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.nit}"></td>
                    <td th:text="${c.nombreCompleto}"></td>
                    <td th:text="${c.email}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i> Editar</a>
                        <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este cliente?')">
                            <i class="bi bi-trash"></i> Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small">
            Total: <span th:text="${#lists.size(clientes)}"></span> clientes
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
