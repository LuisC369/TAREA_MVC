<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Puesto')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('puestos')}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h1 class="h3 mb-3" th:text="${puesto.idPuesto == 0} ? 'Nuevo puesto' : 'Editar puesto'">Puesto</h1>

            <div th:replace="~{fragments/layout :: alertas}"></div>

            <form th:action="@{/puestos/guardar}" th:object="${puesto}" method="post"
                  class="card card-body shadow-sm border-0">
                <input type="hidden" th:field="*{idPuesto}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del puesto</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" maxlength="50" required>
                </div>

                <div class="mb-4">
                    <label for="salarioBase" class="form-label">Salario base</label>
                    <div class="input-group">
                        <span class="input-group-text">Q</span>
                        <!-- Si el puesto es nuevo (salario 0) la caja sale vacia -->
                        <input type="number" id="salarioBase" name="salarioBase" class="form-control"
                               th:value="${puesto.salarioBase == 0} ? '' : ${puesto.salarioBase}"
                               step="0.01" min="0.01" required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                    <button type="reset" class="btn btn-outline-secondary"><i class="bi bi-eraser"></i> Limpiar</button>
                    <a href="/puestos" class="btn btn-link ms-auto">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
