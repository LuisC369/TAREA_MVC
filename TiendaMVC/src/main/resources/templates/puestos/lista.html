<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Puestos')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('puestos')}"></nav>

<div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-briefcase"></i> Puestos</h1>
        <a href="/puestos/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo puesto</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div th:if="${puestos.empty}" class="alert alert-info">No hay puestos registrados.</div>

    <div th:unless="${puestos.empty}" class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Puesto</th>
                    <th class="text-end">Salario base</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${puestos}">
                    <td th:text="${p.idPuesto}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(p.salarioBase, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/puestos/editar/{id}(id=${p.idPuesto})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i> Editar</a>
                        <a th:href="@{/puestos/eliminar/{id}(id=${p.idPuesto})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este puesto?')">
                            <i class="bi bi-trash"></i> Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small">
            Total: <span th:text="${#lists.size(puestos)}"></span> puestos
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
