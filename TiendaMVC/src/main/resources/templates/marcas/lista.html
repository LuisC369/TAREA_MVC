<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcas')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar('marcas')}"></nav>

<div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-tags"></i> Marcas</h1>
        <a href="/marcas/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva marca</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div th:if="${marcas.empty}" class="alert alert-info">No hay marcas registradas.</div>

    <div th:unless="${marcas.empty}" class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${marcas}">
                    <td th:text="${m.idMarca}"></td>
                    <td th:text="${m.nombre}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/marcas/editar/{id}(id=${m.idMarca})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i> Editar</a>
                        <a th:href="@{/marcas/eliminar/{id}(id=${m.idMarca})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar esta marca?')">
                            <i class="bi bi-trash"></i> Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small">
            Total: <span th:text="${#lists.size(marcas)}"></span> marcas
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
